name: Tests

on:
  push:
    paths-ignore:
      - '.agents/skills/**'
      - '.claude/skills/**'
    branches: ["main"]
  pull_request:
    paths-ignore:
      - '.agents/skills/**'
      - '.claude/skills/**'
    branches: ["main"]

# Least-privilege GITHUB_TOKEN: the test/lint/e2e jobs only read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload with OIDC (no token secret)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check src/shared/blueprint.js
          node --check src/shared/config.js
          node --check src/shared/paths.js
          node --check src/shared/storage.js
          node --check src/shared/protocol.js
          node --check src/runtime/bootstrap.js
          node --check src/runtime/bootstrap-paths.js
          node --check src/runtime/blueprint-steps.js
          node --check src/runtime/install-script.js
          node --check src/runtime/php-prepend.js
          node --check src/runtime/crash-recovery.js
          node --check src/runtime/fs-persistence.js
          node --check src/runtime/manifest.js
          node --check src/runtime/php-compat.js
          node --check src/runtime/php-loader.js
          node --check src/runtime/vfs.js
          node --check src/remote/main.js
          node --check src/shell/main.js
          node --check lib/nextcloud-loader.js
          node --check lib/streaming-tar-extract.js
          node --check scripts/lib/tar-ustar.mjs
          node --check php-worker.js
          node --check sw.js

      - name: Run unit tests
        run: make coverage

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

      - name: Lint
        run: make lint

      - name: Sync browser dependencies (vendor/)
        run: npm run sync-browser-deps

      - name: Build worker bundle
        run: npm run build-worker

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build docs
        run: mkdocs build --strict

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24: the tar.zst packer (scripts/build-tar-zst-bundle.mjs) needs
          # native node:zlib zstd (>= 22.15) to build the core bundle.
          node-version: 24
          cache: npm

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"

      - name: Install dependencies
        run: npm ci

      - name: Build Nextcloud default bundle (NC 34)
        run: make bundle

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: "true"
